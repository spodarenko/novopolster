<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Serve the real app at the clean root URL. Every relative path below
     (styles, bundle, section scripts, assets referenced as ../../ inside the
     JSX) resolves against this base = the marketing-website folder, so no source
     file needs its paths rewritten. -->
<base href="artifacts/novopolster-design-system/ui_kits/marketing-website/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovoPolster — Polsterreinigung München</title>
<meta name="description" content="Professionelle Polsterreinigung in München und Umgebung (30 km): Sofas, Matratzen, Autositze und Sessel — mobil bei Ihnen vor Ort. Transparente Preise, Anfrage per WhatsApp in 30 Sekunden.">
<meta name="robots" content="index, follow">

<!-- Open Graph / social preview. URLs point at the live GitHub Pages site.
     og:image currently reuses the hero webp; for best previews replace it with a
     dedicated 1200x630 JPG/PNG (webp support in scrapers is inconsistent).
     Update these absolute URLs if the site moves to a custom domain. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="NovoPolster">
<meta property="og:locale" content="de_DE">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:locale:alternate" content="uk_UA">
<meta property="og:locale:alternate" content="it_IT">
<meta property="og:title" content="NovoPolster — Polsterreinigung München">
<meta property="og:description" content="Chemische Reinigung von Polstermöbeln, Matratzen und Autositzen — mobil in München + 30 km.">
<meta property="og:url" content="https://spodarenko.github.io/novopolster/">
<meta property="og:image" content="https://spodarenko.github.io/novopolster/artifacts/novopolster-design-system/assets/images/hero.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NovoPolster — Polsterreinigung München">
<meta name="twitter:description" content="Chemische Reinigung von Polstermöbeln, Matratzen und Autositzen — mobil in München + 30 km.">
<meta name="twitter:image" content="https://spodarenko.github.io/novopolster/artifacts/novopolster-design-system/assets/images/hero.webp">

<!-- hreflang is intentionally NOT emitted. Real hreflang needs a distinct
     crawlable URL per language (e.g. /de /en /ua /it). This site serves all four
     languages from one URL via client-side switching, so hreflang tags would
     point nowhere. Add them once per-language URLs exist. -->

<link rel="stylesheet" href="../../styles.css">
<!-- Fonts (Exo 2 + Golos Text) are self-hosted via ../../styles.css. No Google
     Fonts CDN: avoids sending visitor IPs to Google (GDPR — LG München I). -->

<!-- React production builds. JSX is precompiled to plain .js by `npm run build`
     (Babel), so no @babel/standalone and no React dev build ship to production. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="component-overrides.js"></script>
<script src="i18n.js"></script>
<script src="tweaks-panel.js"></script>
<style>body{margin:0;}</style>
</head>
<body>
<div id="root"></div>
<script src="sections/Hero.js"></script>
<script src="sections/Benefits.js"></script>
<script src="sections/Services.js"></script>
<script src="sections/ServicesPricing.js"></script>
<script src="sections/Process.js"></script>
<script src="sections/FAQSection.js"></script>
<script src="sections/ServiceArea.js"></script>
<script src="sections/ContactSection.js"></script>
<script src="sections/FinalCTA.js"></script>
<script src="sections/WhatsAppFloat.js"></script>
<script src="App.js"></script>
<!-- With <base> set, in-page "#anchor" links would otherwise navigate to the
     base document. Intercept them and smooth-scroll instead. -->
<script>
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  var id = a.getAttribute('href').slice(1);
  var el = id && document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
});
</script>
</body>
</html>
