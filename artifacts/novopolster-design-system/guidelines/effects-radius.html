<!-- @dsCard group="Effects" viewport="700x160" name="Radius scale" subtitle="Crisp, not bubbly — echoes the mark's hard angles" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:160px;background:var(--color-bg);display:flex;align-items:center;justify-content:center;gap:20px;font-family:var(--font-body);}
  .box{width:76px;height:76px;background:var(--teal-500);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;}
</style></head>
<body>
  <div class="box" style="border-radius:var(--radius-sm)">sm 4</div>
  <div class="box" style="border-radius:var(--radius-md)">md 8</div>
  <div class="box" style="border-radius:var(--radius-lg)">lg 14</div>
  <div class="box" style="border-radius:var(--radius-xl)">xl 20</div>
  <div class="box" style="border-radius:var(--radius-pill)">pill</div>
</body></html>
