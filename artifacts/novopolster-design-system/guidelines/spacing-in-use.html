<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing in use" subtitle="Card padding, gaps and section rhythm at real sizes" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:220px;background:var(--color-bg-sunken);font-family:var(--font-body);padding:24px;box-sizing:border-box;display:flex;gap:16px;}
  .card{flex:1;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:8px;}
  .t{font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);color:var(--color-text-primary);}
  .s{font-size:var(--text-sm);color:var(--color-text-secondary);}
</style></head>
<body>
  <div class="card"><div class="t">Sofa-Reinigung</div><div class="s">Card padding: 24px · gap: 8px</div></div>
  <div class="card"><div class="t">Matratzen-Reinigung</div><div class="s">Section gap between cards: 16px</div></div>
</body></html>
