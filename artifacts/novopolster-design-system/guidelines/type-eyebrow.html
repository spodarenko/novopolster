<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:150px;background:var(--color-bg);display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--font-body);}
  .eyebrow{font-size:var(--text-sm);font-weight:600;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--color-brand);display:flex;align-items:center;gap:10px;}
  .eyebrow::before, .eyebrow::after{content:"";width:24px;height:1px;background:var(--color-brand);}
</style></head>
<body><div class="eyebrow">Unsere Leistungen</div></body></html>
