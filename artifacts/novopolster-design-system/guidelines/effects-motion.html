<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:150px;background:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);}
  .btn{background:var(--color-brand);color:#fff;padding:14px 28px;border-radius:var(--radius-md);font-weight:600;font-size:var(--text-base);transition:transform var(--duration-base) var(--ease-standard), background var(--duration-base) var(--ease-standard);}
  .btn:hover{background:var(--color-brand-hover);transform:translateY(-2px);}
  .btn:active{transform:translateY(0px) scale(0.98);}
</style></head>
<body><div class="btn">Termin anfragen</div></body></html>
