<!-- @dsCard group="Effects" viewport="700x180" name="Shadow scale" subtitle="Warm, low-opacity ambient shadows — never pure black" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:180px;background:var(--color-bg-sunken);display:flex;align-items:center;justify-content:center;gap:28px;font-family:var(--font-body);font-size:12px;color:var(--color-text-secondary);}
  .box{width:90px;height:60px;background:var(--color-surface);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;}
</style></head>
<body>
  <div><div class="box" style="box-shadow:var(--shadow-xs)"></div><div style="text-align:center;margin-top:8px">xs</div></div>
  <div><div class="box" style="box-shadow:var(--shadow-sm)"></div><div style="text-align:center;margin-top:8px">sm</div></div>
  <div><div class="box" style="box-shadow:var(--shadow-md)"></div><div style="text-align:center;margin-top:8px">md</div></div>
  <div><div class="box" style="box-shadow:var(--shadow-lg)"></div><div style="text-align:center;margin-top:8px">lg</div></div>
  <div><div class="box" style="box-shadow:var(--shadow-brand)"></div><div style="text-align:center;margin-top:8px">brand</div></div>
</body></html>
