<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:340px;background:var(--color-bg);font-family:var(--font-display);padding:16px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;justify-content:center;color:var(--color-text-primary);}
  .row{display:flex;align-items:baseline;gap:12px;}
  .tag{font-family:var(--font-body);font-size:11px;color:var(--color-text-muted);width:120px;flex-shrink:0;}
</style></head>
<body>
  <div class="row"><span class="tag">6xl / 74</span><span style="font-size:var(--text-6xl);font-weight:800;">Aa</span></div>
  <div class="row"><span class="tag">4xl / 48</span><span style="font-size:var(--text-4xl);font-weight:700;">Aa Polster</span></div>
  <div class="row"><span class="tag">2xl / 30</span><span style="font-size:var(--text-2xl);font-weight:700;">Aa Polster</span></div>
  <div class="row"><span class="tag">lg / 20</span><span style="font-size:var(--text-lg);font-weight:600;">Aa Polster</span></div>
  <div class="row"><span class="tag">base / 17</span><span style="font-size:var(--text-base);font-family:var(--font-body);font-weight:400;">Aa Polster reinigen</span></div>
  <div class="row"><span class="tag">sm / 15</span><span style="font-size:var(--text-sm);font-family:var(--font-body);font-weight:400;">Aa Polster reinigen</span></div>
  <div class="row"><span class="tag">xs / 13</span><span style="font-size:var(--text-xs);font-family:var(--font-body);font-weight:400;">Aa Polster reinigen</span></div>
</body></html>
