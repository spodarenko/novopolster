<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base grid — --space-1 … --space-24" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:200px;background:var(--color-bg);font-family:var(--font-body);padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;justify-content:center;}
  .row{display:flex;align-items:center;gap:12px;}
  .bar{background:var(--color-brand);height:10px;border-radius:2px;}
  .tag{font-size:11px;color:var(--color-text-muted);width:90px;flex-shrink:0;}
</style></head>
<body>
  <div class="row"><span class="tag">space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tag">space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tag">space-6 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tag">space-10 · 40px</span><div class="bar" style="width:40px"></div></div>
  <div class="row"><span class="tag">space-16 · 64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="tag">space-24 · 96px</span><div class="bar" style="width:96px"></div></div>
</body></html>
