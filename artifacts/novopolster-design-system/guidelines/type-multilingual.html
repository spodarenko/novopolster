<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:220px;background:var(--color-bg);font-family:var(--font-body);padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;justify-content:center;}
  .row{display:flex;gap:12px;align-items:baseline;}
  .flag{font-size:11px;font-weight:700;letter-spacing:var(--tracking-wide);color:var(--color-text-muted);width:28px;flex-shrink:0;}
  .txt{font-size:var(--text-base);color:var(--color-text-primary);}
</style></head>
<body>
  <div class="row"><span class="flag">DE</span><span class="txt">Transparente Preise, sofort sichtbar.</span></div>
  <div class="row"><span class="flag">EN</span><span class="txt">Transparent pricing, shown upfront.</span></div>
  <div class="row"><span class="flag">UA</span><span class="txt">Прозорі ціни — одразу, без запитів.</span></div>
  <div class="row"><span class="flag">IT</span><span class="txt">Prezzi trasparenti, subito visibili.</span></div>
</body></html>
