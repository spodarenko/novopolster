<!-- @dsCard group="Effects" viewport="700x160" name="Borders & dividers" subtitle="1px hairlines carry most of the separation — shadows stay minimal" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;height:160px;background:var(--color-bg);display:flex;align-items:center;padding:0 24px;box-sizing:border-box;gap:20px;font-family:var(--font-body);font-size:13px;color:var(--color-text-secondary);}
  .card{flex:1;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:16px;background:var(--color-surface);}
  .card.strong{border:1.5px solid var(--color-border-strong);}
  .card.brand{border:1px solid var(--color-brand-border);background:var(--color-brand-subtle);}
</style></head>
<body>
  <div class="card">--color-border</div>
  <div class="card strong">--color-border-strong</div>
  <div class="card brand">--color-brand-border</div>
</body></html>
